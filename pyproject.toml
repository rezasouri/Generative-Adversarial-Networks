[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "forgegan"
version = "0.1.0"
description = "Reproducible industrial defect synthesis and generative anomaly detection"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Reza Souri" }]
dependencies = [
  "torch>=2.2",
  "torchvision>=0.17",
  "numpy>=1.26",
  "Pillow>=10.0",
  "PyYAML>=6.0",
  "tqdm>=4.66",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5", "mypy>=1.10"]
demo = ["gradio>=4.0"]
metrics = ["torchmetrics>=1.4", "torch-fidelity>=0.3"]

[project.scripts]
forgegan = "forgegan.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["forgegan*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
